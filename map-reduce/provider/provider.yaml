apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider
  template:
    metadata:
      labels:
        app: provider
    spec:
      containers:
        - name: provider
          image: provider-image
          imagePullPolicy: Never  # Use local image from Minikube's Docker
          ports:
            - containerPort: 1234
          env:
            - name: PORT
              value: "1234"
            - name: HOST
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: provider-service
  namespace: default
spec:
  selector:
    app: provider
  ports:
    - port: 1234
      targetPort: 1234
  type: ClusterIP